<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELEMENT & EVEENT</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="head">
      <h1>ELEMENT & EVEENT</h1>
    </div>
    &nbsp;
    <div class="container">
      <button type="button" class="btn btn-outline-primary" id="changeColorBtn">
        CLICK ME
      </button>
      <div class="input">
        <input type="text" id="inputBox" class="form-control mt-3" placeholder="พิมพ์อะไรสักอย่าง...">
        <p id="message"></p>
      </div>
      <div class="img">
        <img id="Tastar" src="img/Webnovel_Illustration_CH_300_-_TeSTAR_29.webp" alt="">
      </div>
      <div class="button-click">
        <button id="clickBtn" class="btn btn-outline-primary">ซ่อน</button>
      </div>
      &nbsp;
      <form id="userForm">
        <label for="email">อีเมล:</label>
        <input  id="email" name="email" required>
        <div class="button-submit">
          <button type="submit" class="btn btn-outline-primary">ส่งข้อมูล</button>
          <p id="messageform"></p>
        </div>
      </form>
    </div>


    <script src="script.js"></script>
  </body>
</html>
