<!DOCTYPE html>

  <head>

        </tr>
        <tr>
          <td>CSI101</td>
          <td>
            <input
              type="number"
              id="score1"
              min="0"
              max="100"
              oninput="validateInput(this)"
            />
          </td>
          <td>3</td>
        </tr>
        <tr>
          <td>CSI102</td>

        <tr>

        </tr>
        <tr>
          <td>CSI204</td>

              id="score4"

              max="100"
              oninput="validateInput(this)"
            />
          </td>
          <td>3</td>
        </tr>
        <tr>
          <td>CSI305</td>
          <td>
            <input
              type="number"
              id="score5"
              min="0"
              max="100"
              oninput="validateInput(this)"
            />
          </td>
          <td>3</td>
        </tr>
      </table>
      <button onclick="calculateGPA()">คำนวณ GPA</button>
      <h3 id="result"></h3>
    </div>
    <script src="grade.js"></script>
  </body>
</html>
